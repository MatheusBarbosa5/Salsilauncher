[project]
name = "salsilauncher-server"
version = "0.2.0"
description = "API remota do Salsilauncher"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlmodel>=0.0.47,<0.1",
  "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2", "httpx>=0.28,<1", "alembic>=1.14,<2",
  "email-validator>=2,<3", "beautifulsoup4>=4.12,<5"
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.uv]
link-mode = "copy"
