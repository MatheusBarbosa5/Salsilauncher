services:
  db:
    image: postgres:16
    container_name: salsilauncher-db
    environment:
      POSTGRES_USER: salsi
      POSTGRES_PASSWORD: salsi123
      POSTGRES_DB: salsilauncher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: salsilauncher-adminer
    ports:
      - "8080:8080"

volumes:
  postgres_data: